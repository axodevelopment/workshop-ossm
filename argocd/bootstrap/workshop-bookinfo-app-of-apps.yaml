apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-bookinfo-app-of-apps
  namespace: openshift-gitops
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: workshop
  source:
    repoURL: https://github.com/axodevelopment/workshop-ossm
    targetRevision: main
    path: workshop/bookinfo/1.0
    directory:
      recurse: true
      include: "*/application.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: bookinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true