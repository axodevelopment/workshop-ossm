apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitea
    spec:
      serviceAccountName: gitea
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: registry.redhat.io/rhel9/postgresql-15:latest
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready \
                -h gitea-postgresql.gitea.svc.cluster.local \
                -p 5432 \
                -U $(POSTGRESQL_USER); do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done
              echo "PostgreSQL is ready."
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secret
                  key: POSTGRES_USER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: gitea
          image: gitea/gitea:1.22.3
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          envFrom:
            - configMapRef:
                name: gitea-config
          env:
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-app-secret
                  key: SECRET_KEY
            - name: GITEA__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-app-secret
                  key: INTERNAL_TOKEN
            - name: GITEA__oauth2__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-app-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data