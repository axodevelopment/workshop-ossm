apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-init-sa
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitea-init-role
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitea-init-rolebinding
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: gitea-init-sa
    namespace: gitea
roleRef:
  kind: Role
  name: gitea-init-role
  apiGroup: rbac.authorization.k8s.io