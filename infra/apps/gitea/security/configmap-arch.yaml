apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-config
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  app.ini: |
    APP_NAME = Gitea — snoaxolab Workshop
    RUN_MODE = prod

    [server]
    DOMAIN           = gitea.apps.snoaxolab.axodevelopment.dev
    ROOT_URL         = https://gitea.apps.snoaxolab.axodevelopment.dev/
    HTTP_PORT        = 3000
    START_SSH_SERVER = false
    LFS_START_SERVER = true
    LFS_CONTENT_PATH = /data/gitea/lfs

    [database]
    DB_TYPE  = postgres
    HOST     = gitea-postgresql.gitea.svc.cluster.local:5432
    NAME     = gitea
    USER     = gitea
    PASSWD   = _env:GITEA__database__PASSWD
    SSL_MODE = disable

    [repository]
    ROOT = /data/gitea/repositories

    [security]
    INSTALL_LOCK        = true
    SECRET_KEY          = _env:GITEA__security__SECRET_KEY
    INTERNAL_TOKEN      = _env:GITEA__security__INTERNAL_TOKEN
    PASSWORD_COMPLEXITY = off

    [oauth2]
    JWT_SECRET = _env:GITEA__oauth2__JWT_SECRET

    [service]
    DISABLE_REGISTRATION              = false
    REQUIRE_SIGNIN_VIEW               = false
    REGISTER_EMAIL_CONFIRM            = false
    ENABLE_NOTIFY_MAIL                = false
    NO_REPLY_ADDRESS                  = noreply@gitea.apps.snoaxolab.axodevelopment.dev

    [mailer]
    ENABLED = false

    [cache]
    ADAPTER = memory

    [session]
    PROVIDER = memory

    [log]
    MODE      = console
    LEVEL     = info
    ROOT_PATH = /data/gitea/log

    [webhook]
    ALLOWED_HOST_LIST = *
