apiVersion: v1
kind: ConfigMap
metadata:
  name: rhdh-app-config
  namespace: rhdh
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub — snoaxolab
      baseUrl: https://backstage-rhdh-rhdh.apps.snoaxolab.axodevelopment.dev

    branding:
      fullLogo: ${BASE64_EMBEDDED_FULL_LOGO}
      fullLogoWidth: 110px
      iconLogo: ${BASE64_EMBEDDED_ICON_LOGO}

    backend:
      baseUrl: https://backstage-rhdh-rhdh.apps.snoaxolab.axodevelopment.dev
      cors:
        origin: https://backstage-rhdh-rhdh.apps.snoaxolab.axodevelopment.dev
      cache:
        store: redis
        connection: redis://:${REDIS_PASSWORD}@redis.rhdh.svc.cluster.local:6379
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: backstage

    auth:
      environment: production
      session:
        secret: ${KEYCLOAK_CLIENT_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: >-
              https://keycloak.apps.snoaxolab.axodevelopment.dev/realms/rhdh/.well-known/openid-configuration
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            # Uncomment if you need role-based sign-in resolution:
            # signIn:
            #   resolvers:
            #     - resolver: preferredUsernameMatchingUserEntityName
      dangerouslyAllowSignInWithoutUserInCatalog: true

    signInPage: oidc

    integrations:
      gitea:
        - baseUrl: ${GITEA_BASE_URL}
          username: gitea-admin
          password: ${GITEA_TOKEN}

    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      providers:
        gitea:
          snoaxolab:
            host: ${GITEA_BASE_URL}
            orgName: '*'
            catalogPath: /catalog-info.yaml
            filters:
              branch: main
            schedule:
              frequency:
                minutes: 30
              timeout:
                minutes: 3

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local
      cache:
        ttl: 3600000

    permission:
      enabled: true
      rbac:
        admin:
          users:
            - name: user:default/rhdh-admin
        pluginsWithPermission:
          - catalog
          - scaffolder
          - permission