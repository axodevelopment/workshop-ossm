apiVersion: v1
kind: ConfigMap
metadata:
  name: rhdh-app-config
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  app-config.yaml: |
    app:
      title: Red Hat Developer Hub — snoaxolab
      baseUrl: https://backstage-rhdh-rhdh.apps.snoaxolab.axodevelopment.dev

    branding:
      fullLogo: ${BASE64_EMBEDDED_FULL_LOGO}
      fullLogoWidth: 110px
      iconLogo: ${BASE64_EMBEDDED_ICON_LOGO}

    backend:
      baseUrl: https://backstage-rhdh-rhdh.apps.snoaxolab.axodevelopment.dev
      cors:
        origin: https://backstage-rhdh-rhdh.apps.snoaxolab.axodevelopment.dev
      cache:
        store: redis
        connection: redis://:${REDIS_PASSWORD}@redis.rhdh.svc.cluster.local:6379
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: backstage

    auth:
      environment: production
      session:
        secret: ${SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: ${KEYCLOAK_BASE_URL}/.well-known/openid-configuration
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            prompt: auto
            dangerouslyAllowSignInWithoutUserInCatalog: true
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
                - resolver: emailMatchingUserEntityProfileEmail
                - resolver: emailLocalPartMatchingUserEntityName

    signInPage: oidc

    integrations:
      gitea:
        - host: ${GITEA_HOST}
          username: gitea-admin
          password: ${GITEA_TOKEN}

    catalog:
      rules:
        - allow:
            - Component
            - System
            - API
            - Resource
            - Location
            - Template
            - User
            - Group
      providers:
        keycloakOrg:
          default:
            baseUrl: ${KEYCLOAK_BASE_URL}
            clientId: ${KEYCLOAK_CLIENT_ID}
            clientSecret: ${KEYCLOAK_CLIENT_SECRET}
            realm: ${KEYCLOAK_REALM}
            loginRealm: ${KEYCLOAK_LOGIN_REALM}
            userQuerySize: 100
            groupQuerySize: 100
            schedule:
              frequency: { hours: 1 }
              timeout: { minutes: 50 }
              initialDelay: { seconds: 15 }
      locations:
        # Gitea catalog location — repo seeded by gitea/init/job-admin-init.yaml
        # Add additional locations here ...
        - type: url
          target: https://gitea.apps.snoaxolab.axodevelopment.dev/workshop/catalog/raw/branch/main/catalog-info.yaml
          rules:
            - allow:
                - Component
                - System
                - API
                - Resource
                - Location
                - Template
                - User
                - Group

    techdocs:
      builder: local
      generator:
        runIn: local
      publisher:
        type: local
      cache:
        ttl: 3600000

    permission:
      enabled: true
      rbac:
        admin:
          users:
            - name: user:default/rhdh-admin
        pluginsWithPermission:
          - catalog
          - scaffolder
          - permission