apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  namespace: rhdh
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml

    plugins:
      # ── RBAC ────────────────────────────────────────────────────────────────
      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
        disabled: false

      # ── Gitea catalog provider ──────────────────────────────────────────────
      # Community plugin — verify package path exists in your RHDH image with:
      # oc exec -n rhdh deploy/backstage-rhdh -- ls /opt/app-root/src/dynamic-plugins/dist/ | grep gitea
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-gitea
        disabled: false

      # ── TechDocs ────────────────────────────────────────────────────────────
      - package: ./dynamic-plugins/dist/backstage-plugin-techdocs
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend
        disabled: false

      # ── OIDC auth backend ───────────────────────────────────────────────────
      - package: ./dynamic-plugins/dist/backstage-plugin-auth-backend-module-oidc-provider
        disabled: false