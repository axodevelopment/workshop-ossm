apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-grant-createdb
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: grant
          image: registry.redhat.io/rhel9/postgresql-15:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL to accept connections..."
              until pg_isready \
                -h postgresql.rhdh.svc.cluster.local \
                -p 5432 \
                -U postgres; do
                echo "  not ready, retrying in 3s..."
                sleep 3
              done
              echo "Granting CREATEDB to backstage user..."
              PGPASSWORD=${POSTGRES_ADMIN_PASSWORD} psql \
                -h postgresql.rhdh.svc.cluster.local \
                -p 5432 \
                -U postgres \
                -c "ALTER USER backstage CREATEDB;"
              echo "Grant complete."
          env:
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rhdh-secrets
                  key: POSTGRES_ADMIN_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true