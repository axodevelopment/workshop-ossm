apiVersion: v1
kind: Secret
metadata:
  name: keycloak-openshift-secret
  namespace: openshift-config
stringData:
  clientSecret: openshift-client-secret
---
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - name: keycloak
    mappingMethod: claim
    type: OpenID
    openID:
      clientID: openshift
      clientSecret:
        name: keycloak-openshift-secret
      issuer: https://keycloak.apps.snoaxolab.axodevelopment.dev/realms/workshop
      ca:
        name: keycloak-ca
      claims:
        preferredUsername:
        - preferred_username
        name:
        - name
        email:
        - email
        groups:
        - groups