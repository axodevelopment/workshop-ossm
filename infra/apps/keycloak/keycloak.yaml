apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  #ingress:
  #  className: openshift-default
  #  tlsSecret: example-tls-secret
  instances: 1
  hostname:
    hostname: keycloak.apps.snoaxolab.axodevelopment.dev
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  db:
    vendor: postgres
    host: postgres
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  #tracing:
  #  enabled: true
  #  endpoint: http://...:4317
  #  samplerType: parentbased_traceidratio
  #  samplerRatio: 0.01
  #  resourceAttributes:
  #    some.attribute: something